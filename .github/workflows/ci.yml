name: Isolated TV release build
on: push
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c07e47b47111e89686b0ce795676bc3e460e973d
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble isolated release and test APKs
        run: |
          export CELASTRINA_KEYSTORE="$RUNNER_TEMP/device-check.p12"
          export CELASTRINA_KEYSTORE_PASSWORD=device-check CELASTRINA_KEY_ALIAS=device-check CELASTRINA_KEY_PASSWORD=device-check
          keytool -genkeypair -keystore "$CELASTRINA_KEYSTORE" -storetype PKCS12 -alias device-check \
            -storepass device-check -keypass device-check -keyalg RSA -keysize 2048 -validity 1 -dname CN=CelastrinaDeviceCheck
          ./gradlew -PisolatedDeviceCheck=true -PtestBuildType=release :app:assembleRelease :app:assembleReleaseAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: tv-release-test-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          retention-days: 1
