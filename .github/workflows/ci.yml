name: Disposable emulator lifecycle verification
on: push
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test lifecycle without an Android emulator
        run: python -B -m unittest discover -s scripts -p test_disposable_emulator.py -v
