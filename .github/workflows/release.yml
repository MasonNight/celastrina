name: Release

# Pushing a vMAJOR.MINOR.PATCH tag on main builds, tests, signs and publishes a GitHub Release holding
# celastrina-<version>.apk and SHA256SUMS. The signing key and the project TMDB key are secrets of the `release`
# environment, which only v* tags can use (docs/release-keystore.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.released.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
      - name: Earlier releases
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Fails on a tag that isn't vMAJOR.MINOR.PATCH, or isn't higher than every earlier release.
      - name: Version
        id: version
        # pipefail, so a refused tag fails the step.
        shell: bash
        env:
          RELEASED: ${{ steps.released.outputs.tags }}
        run: |
          version="$(./gradlew -q :app:printReleaseVersion "-PreleaseTag=$GITHUB_REF_NAME" "-PreleasedTags=$RELEASED" | tail -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests, Android lint, and the debug APK's platform rules.
      - name: Check
        run: ./gradlew check --console=plain

  gates:
    needs: version
    uses: ./.github/workflows/release-gates.yml

  publish:
    needs: [version, check, gates]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The earlier release's tag, to compare protocol_version for the notes.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # The signed release build reads no cache another build could have written.
          cache-disabled: true
      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || { echo "::error::The release environment has no RELEASE_KEYSTORE_BASE64"; exit 1; }
          base64 -d <<<"$RELEASE_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"
          echo "CELASTRINA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # Fails (verifyReleaseInputs) without TMDB_API_KEY or any of the signing secrets.
      - name: Build the signed release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CELASTRINA_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CELASTRINA_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CELASTRINA_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASED: ${{ needs.version.outputs.released }}
        run: ./gradlew :app:assembleRelease :app:verifyReleaseApk "-PreleaseTag=$GITHUB_REF_NAME" "-PreleasedTags=$RELEASED" --console=plain
      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      # v2 and v3, an RSA 4096 key, and the certificate the README records.
      - name: Signature
        run: scripts/verify-apk-signature.sh --release app/build/outputs/apk/release/app-release.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.version.outputs.released }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/celastrina-$VERSION.apk"
          (cd dist && sha256sum "celastrina-$VERSION.apk" > SHA256SUMS)
          # The generated notes, after a "For agents" line when protocol_version changed since the last release.
          previous="$(tr ',' '\n' <<<"$RELEASED" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          scripts/release-notes-for-agents.sh "$previous" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md" \
            --title "Celastrina $VERSION" "dist/celastrina-$VERSION.apk" dist/SHA256SUMS
