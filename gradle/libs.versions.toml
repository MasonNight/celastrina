[versions]
agp = "8.7.3"
kotlin = "2.3.21"
coroutines = "1.9.0"
serialization = "1.7.3"
junit = "5.11.3"
compose-bom = "2024.12.01"
tv-material = "1.0.1"
activity-compose = "1.9.3"
coil = "2.7.0"
profileinstaller = "1.3.1"
media3 = "1.5.1"
animalsniffer = "2.0.1"
gummy-bears = "0.12.0"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"
# CloudStream's GPL-3.0 `library`, which Extensions run against (ADR 0001). Pinned to one exact version per Celastrina
# release; it needs Kotlin 2.3. Later versions need compileSdk 36 or more. r8 dexes the test Extension.
cloudstream = "v4.7.0"
r8 = "8.13.25"
# What CloudStream's library v4.7.0 was built with; the test Extension compiles against them.
nicehttp = "0.4.17"
jackson-kotlin = "2.13.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
android-signature-api25 = { module = "com.toasttab.android:gummy-bears-api-25", version.ref = "gummy-bears" }

cloudstream-library = { module = "com.github.recloudstream.cloudstream:library", version.ref = "cloudstream" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
nicehttp = { module = "com.github.Blatzar:NiceHttp", version.ref = "nicehttp" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson-kotlin" }
# Celastrina's own build logic (build-logic/), an included build; the app's build script loads it.
celastrina-build-logic = { module = "dev.celastrina.build:build-logic" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
