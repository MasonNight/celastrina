# Sized for a 4 GB build box: one JVM, no separate Kotlin daemon.
org.gradle.jvmargs=-Xmx1800m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.compiler.execution.strategy=in-process
# TMDB_API_KEY is a build input: pass -PTMDB_API_KEY=..., set it in ~/.gradle/gradle.properties,
# or export it as an environment variable. Never put it in this file.
